name: Build & Deploy to XServer Static

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r business/requirements.txt
      - run: npm ci --prefix web
      - run: npm run check
      - run: |
          python -m unittest discover -s business/tests -v
          python business/ops/flow.py status > /dev/null
      - run: npm run build
      - run: node scripts/check-web-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: platform-dist-${{ github.sha }}
          path: web/dist/
          retention-days: 90
          if-no-files-found: error
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-dist-${{ github.sha }}
          path: dist/
      - name: Verify exact artifact before publication
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Deploy existing portal via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          security: strict
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            unity/**
            unity-staging/**
      - name: Confirm deployed version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 3 "https://game.kihamda.net/build-version.json?sha=$EXPECTED_SHA" > version.json
          node -e 'const v=JSON.parse(require("fs").readFileSync("version.json")); if(v.commit!==process.env.EXPECTED_SHA) process.exit(1)'
      - name: Report publication outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: echo "Portal deployment result is $OUTCOME. Artifact platform-dist-${{ github.sha }} is retained for recovery." >> "$GITHUB_STEP_SUMMARY"
