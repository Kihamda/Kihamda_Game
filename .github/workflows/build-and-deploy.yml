name: Portal UX production delivery

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Monorepo CI for the current main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact-main CI package
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['CI_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('Invalid CI run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if (run['head_sha'] != os.environ['GITHUB_SHA'] or run['status'] != 'completed'
                  or run['conclusion'] != 'success' or run['path'] != '.github/workflows/ci.yml'
                  or run['head_repository']['full_name'] != repo):
              raise SystemExit('Successful exact-main Monorepo CI required')
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo, '--name',
                          'web-release-' + os.environ['GITHUB_SHA'], '--dir', 'artifacts/ci'], check=True)
          archive = Path('artifacts/ci/web-release.tar.gz')
          expected = Path('artifacts/ci/web-release.tar.gz.sha256').read_text().split()[0]
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('CI archive hash differs')
          PY
          mkdir -p artifacts/package
          tar -xzf artifacts/ci/web-release.tar.gz -C artifacts/package
          node scripts/web-release-package.mjs verify artifacts/package
      - name: Retain previous portal and publish dependencies before home
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python business/ops/portal_publish.py artifacts/package artifacts/portal-recovery artifacts/portal-transaction.json
      - name: Retain publication and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-delivery-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Report publication outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: echo "Portal publication result is $OUTCOME. Games were protected; no remote file deletion. Browser acceptance remains separate." >> "$GITHUB_STEP_SUMMARY"
