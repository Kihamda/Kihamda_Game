name: Game site CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game logic
        run: |
          node --check site/game.js
          node ops/check-games.cjs
          node ops/sum-generator-check.cjs
          node ops/path-check.cjs
          node ops/circuit-check.cjs
          node ops/circuit-five-generator-check.cjs
          node ops/balance-generator-check.cjs
          node ops/daily-storage-check.cjs
          node ops/sort-check.cjs
          node ops/sort-daily-check.cjs
      - name: Check deployment and rollback
        run: |
          python3 ops/test_deploy.py
          python3 ops/test_promote.py
          python3 ops/test_fixed_pages.py
      - name: Install browser test dependencies
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock --fetch-retries=1 --fetch-timeout=30000 playwright
          npx playwright install --only-shell chromium
      - name: Exercise games in a browser
        run: |
          node ops/browser-check.cjs
          node ops/home-filter-check.cjs
          node ops/timing-browser-check.cjs
          node ops/recall-browser-check.cjs
          node ops/code-browser-check.cjs
          node ops/mirror-browser-check.cjs
          node ops/number-browser-check.cjs
          node ops/three-browser-check.cjs
          node ops/new-share-check.cjs
          node ops/series-browser-check.cjs
          node ops/series-share-check.cjs
          node ops/shift-browser-check.cjs
          node ops/swap-browser-check.cjs
          node ops/swap-daily-check.cjs
          node ops/balance-browser-check.cjs
          node ops/balance-daily-check.cjs
          node ops/balance-storage-check.cjs
          node ops/dodge-browser-check.cjs
          node ops/daily-browser-check.cjs
          node ops/daily-cross-day-check.cjs
          node ops/daily-same-day-check.cjs
          node ops/daily-reset-conflict-check.cjs
          node ops/daily-old-record-check.cjs
          node ops/daily-storage-error-check.cjs
          node ops/daily-rollover-check.cjs
          node ops/slide-browser-check.cjs
          node ops/record-browser-check.cjs
          node ops/share-browser-check.cjs
          node ops/layout-browser-check.cjs
          node ops/nav-browser-check.cjs
          node ops/grid-keyboard-check.cjs
          node ops/sum-browser-check.cjs
          node ops/path-browser-check.cjs
          node ops/circuit-browser-check.cjs
          node ops/circuit-five-browser-check.cjs
          node ops/circuit-five-storage-check.cjs
          node ops/circuit-notice-check.cjs
          node ops/circuit-version-check.cjs
          node ops/circuit-difficulty-check.cjs
          node ops/circuit-rollover-switch-check.cjs
          node ops/sort-browser-check.cjs
          node ops/sort-daily-browser-check.cjs
          python3 ops/build_preview.py
          SITE_DIR=preview node ops/home-filter-check.cjs
          node ops/fixed-browser-check.cjs
          SITE_DIR=preview node ops/circuit-notice-check.cjs
          SITE_DIR=preview node ops/circuit-version-check.cjs
