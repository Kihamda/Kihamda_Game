name: Game site CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game logic
        run: |
          node --check site/game.js
          node ops/check-games.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise games in a browser
        run: node ops/browser-check.cjs
