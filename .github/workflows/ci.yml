name: Game site CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game logic
        run: |
          node --check site/game.js
          node ops/check-games.cjs
      - name: Check deployment and rollback
        run: python3 ops/test_deploy.py
      - name: Install browser test dependencies
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock --fetch-retries=1 --fetch-timeout=30000 playwright
          npx playwright install --only-shell chromium
      - name: Exercise games in a browser
        run: node ops/browser-check.cjs
