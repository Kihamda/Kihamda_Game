name: Game site CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game logic
        run: |
          node --check site/game.js
          node ops/check-games.cjs
          node ops/sum-generator-check.cjs
          node ops/path-check.cjs
          node ops/sort-check.cjs
          node ops/sort-daily-check.cjs
      - name: Check deployment and rollback
        run: |
          python3 ops/test_deploy.py
          python3 ops/test_promote.py
          python3 ops/test_fixed_pages.py
      - name: Install browser test dependencies
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock --fetch-retries=1 --fetch-timeout=30000 playwright
          npx playwright install --only-shell chromium
      - name: Exercise games in a browser
        run: |
          node ops/browser-check.cjs
          node ops/dodge-browser-check.cjs
          node ops/daily-browser-check.cjs
          node ops/slide-browser-check.cjs
          node ops/record-browser-check.cjs
          node ops/share-browser-check.cjs
          node ops/layout-browser-check.cjs
          node ops/nav-browser-check.cjs
          node ops/sum-browser-check.cjs
          node ops/path-browser-check.cjs
          node ops/sort-browser-check.cjs
          node ops/sort-daily-browser-check.cjs
          python3 ops/build_preview.py
          node ops/fixed-browser-check.cjs
