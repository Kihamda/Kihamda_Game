name: Monorepo CI

on:
  pull_request:
    branches: [main, dev, ops/game-business]
  push:
    branches: [dev, ops/game-business]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r business/requirements.txt
      - run: npm ci --prefix web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Gameplay rules without Unity license dependency
        run: dotnet run --project tests/CourierCore/CourierCore.csproj
      - name: Repository and Unity GUID contract
        run: npm run check
      - name: Release coordinator failure and output boundaries
        run: node scripts/check-release-preparation.mjs
      - name: Business history and concurrent execution
        run: |
          python -m unittest discover -s business/tests -v
          python business/ops/flow.py status > /dev/null
          python business/ops/flow.py status --ledger business/ops/ledger.json > /dev/null
      - name: Preserve legacy URLs and build
        run: |
          npm run release:prepare -- artifacts/web-release
          node scripts/check-web-build.mjs
          node scripts/check-portal-navigation.mjs
          node scripts/check-portal-work-guides.mjs
          node scripts/check-iceslide.mjs
          node scripts/check-gravityball.mjs
          node scripts/check-minerush.mjs
          node scripts/check-ntiktaktoe.mjs
      - name: Prepare and verify Web release package
        run: |
          node scripts/web-release-package.mjs verify artifacts/web-release
          node scripts/check-web-release-package.mjs artifacts/web-release
          tar -czf artifacts/web-release.tar.gz -C artifacts/web-release .
          mkdir -p artifacts/web-restored
          tar -xzf artifacts/web-release.tar.gz -C artifacts/web-restored
          node scripts/web-release-package.mjs verify artifacts/web-restored
          sha256sum artifacts/web-release.tar.gz > artifacts/web-release.tar.gz.sha256
      - name: Build and verify isolated MineRush candidate
        run: |
          node scripts/build-scoped-minerush.mjs artifacts/scoped-minerush
          python business/ops/scoped_delivery.py artifacts/scoped-minerush --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-minerush-${{ github.sha }}
          path: artifacts/scoped-minerush/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: |
            artifacts/web-release.tar.gz
            artifacts/web-release.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: web/dist/
          retention-days: 30
          if-no-files-found: error
  windows-business:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release coordinator failure and output boundaries
        run: node scripts/check-release-preparation.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r business/requirements.txt
      - run: python -m unittest discover -s business/tests -v
      - run: python business/ops/flow.py status | Out-Null
      - run: python business/ops/flow.py status --ledger business/ops/ledger.json | Out-Null
