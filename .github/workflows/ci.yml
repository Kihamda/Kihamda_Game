name: Game site CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game logic
        run: |
          node --check site/game.js
          node ops/check-games.cjs
          node ops/sum-generator-check.cjs
          node ops/sum-five-independent-check.cjs
          node ops/sum-extreme-independent-check.cjs
          node ops/sum-actual-generator-check.cjs
          node ops/path-check.cjs
          node ops/path-five-generator-check.cjs
          node ops/circuit-check.cjs
          node ops/circuit-five-generator-check.cjs
          node ops/lights-five-generator-check.cjs
          node ops/garden-basic-generator-check.cjs
          node ops/garden-five-generator-check.cjs
          node ops/garden-extreme-generator-check.cjs
          node ops/balance-generator-check.cjs
          node ops/balance-five-strategy-check.cjs
          node ops/balance-five-model-check.cjs
          node ops/balance-five-session-check.cjs
          node ops/swap-five-hard-independent-check.cjs
          node ops/swap-five-extreme-unique-check.cjs
          node ops/swap-five-daily-distribution-check.cjs
          node ops/shift-five-model-check.cjs
          node ops/shift-five-candidates-check.cjs
          node ops/shift-five-session-check.cjs
          node ops/shift-five-normal-valid-check.cjs
          node ops/series-five-model-check.cjs
          node ops/series-five-session-check.cjs
          node ops/daily-storage-check.cjs
          node ops/sort-check.cjs
          node ops/sort-daily-check.cjs
          node ops/sort-five-generator-check.cjs
          node ops/slide-candidates-check.cjs
          node ops/slide-milestone-quality.cjs
          node ops/slide-examples-check.cjs
          node ops/memory-examples-check.cjs
          node ops/memory-alternating-analysis.cjs
          node ops/order-independent-check.cjs
      - name: Check deployment and rollback
        run: |
          python3 ops/test_deploy.py
          python3 ops/test_promote.py
          python3 ops/test_fixed_pages.py
      - name: Install browser test dependencies
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock --fetch-retries=1 --fetch-timeout=30000 playwright
          npx playwright install --only-shell chromium
      - name: Exercise games in a browser
        run: |
          node ops/browser-check.cjs
          node ops/home-filter-check.cjs
          node ops/timing-browser-check.cjs
          node ops/timing-five-candidates-check.cjs
          node ops/timing-five-browser-check.cjs
          node ops/recall-browser-check.cjs
          node ops/recall-five-candidates-check.cjs
          node ops/recall-five-browser-check.cjs
          node ops/code-browser-check.cjs
          node ops/code-five-browser-check.cjs
          node ops/code-five-storage-check.cjs
          node ops/mirror-browser-check.cjs
          node ops/number-browser-check.cjs
          node ops/three-browser-check.cjs
          node ops/new-share-check.cjs
          node ops/series-browser-check.cjs
          node ops/series-share-check.cjs
          node ops/series-five-ui-check.cjs
          node ops/series-five-conflict-check.cjs
          node ops/shift-browser-check.cjs
          node ops/shift-five-site-check.cjs
          node ops/shift-five-conflict-check.cjs
          node ops/shift-five-limit-check.cjs
          node ops/shift-five-normal-storage-check.cjs
          node ops/swap-browser-check.cjs
