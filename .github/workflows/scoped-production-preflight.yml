name: Scoped production preflight (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix web
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-minerush.mjs
      - run: python -m unittest discover -s business/tests -v
      - run: node scripts/build-scoped-minerush.mjs artifacts/scoped-minerush
      - name: Match FTPS root to HTTPS and retain current game
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python business/ops/scoped_delivery.py artifacts/scoped-minerush artifacts/scoped-recovery
      - name: Retain candidate and read-only recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-minerush-preflight-${{ github.sha }}
          path: |
            artifacts/scoped-minerush/
            artifacts/scoped-recovery/
          retention-days: 90
          if-no-files-found: error
