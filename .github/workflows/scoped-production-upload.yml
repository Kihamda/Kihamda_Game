name: Scoped MineRush production delivery

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Monorepo CI run for the current main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The 209-file FTPS baseline is intentionally read more than once. The
    # measured first run switched HTML but timed out during the final re-read.
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful exact-main CI and download its candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['CI_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('Invalid CI run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if (run['head_sha'] != os.environ['GITHUB_SHA'] or run['status'] != 'completed'
                  or run['conclusion'] != 'success' or run['path'] != '.github/workflows/ci.yml'
                  or run['head_repository']['full_name'] != repo):
              raise SystemExit('Successful exact-head Monorepo CI required')
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo, '--name',
                          'scoped-minerush-' + os.environ['GITHUB_SHA'], '--dir',
                          'artifacts/scoped-minerush'], check=True)
          PY
      - run: python business/ops/scoped_delivery.py artifacts/scoped-minerush --verify-only
      - name: Snapshot unrelated production URLs
        run: python business/ops/scoped_acceptance.py snapshot artifacts/protected-before.json
      - name: Retain matched FTPS recovery baseline
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python business/ops/scoped_delivery.py artifacts/scoped-minerush artifacts/scoped-recovery
      - name: Upload MineRush assets and switch entry last
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python business/ops/scoped_upload.py upload artifacts/transaction.json --package artifacts/scoped-minerush --backup artifacts/scoped-recovery
      - name: Verify all delivered bytes and unrelated URLs
        run: python business/ops/scoped_acceptance.py verify artifacts/protected-before.json --package artifacts/scoped-minerush > artifacts/http-acceptance.json
      - name: Retain candidate, recovery and uncertain transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-delivery-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Keep browser acceptance separate
        run: echo 'Exact HTTP bytes verified. Real browser acceptance is still required; no release was registered.' >> "$GITHUB_STEP_SUMMARY"
