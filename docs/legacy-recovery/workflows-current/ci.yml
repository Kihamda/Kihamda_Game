name: CI — Lint & Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify game business runtime
        run: |
          python3 -m unittest discover -s business/tests -v
          python3 business/ops/flow.py status > /dev/null

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
